<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Saioa hasi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center">

  <div class="card bg-secondary-subtle border border-secondary shadow-lg p-4" style="width: 100%; max-width: 420px;">
    <p class="text-secondary small mb-4">Sartu zure kontrol panelera</p>

    <div th:if="${error}" class="alert alert-danger py-2 small fw-semibold" th:text="${error}"></div>

    <form th:action="@{/login}" method="post" id="loginForm" novalidate>
      <input type="hidden" name="selectedRole" id="selectedRoleInput" value="erabiltzaile"/>

      <div class="btn-group w-100 mb-4" role="group" aria-label="Erabiltzaile mota hautatu">
        <input type="radio" class="btn-check" name="roleDisplay" id="btnUser" autocomplete="off" checked onchange="setRole('erabiltzaile')"/>
        <label class="btn btn-outline-primary" for="btnUser">Erabiltzailea</label>

        <input type="radio" class="btn-check" name="roleDisplay" id="btnAdmin" autocomplete="off" onchange="setRole('admin')"/>
        <label class="btn btn-outline-danger" for="btnAdmin">Administratzailea</label>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-secondary text-uppercase small fw-semibold">Helbide elektronikoa</label>
        <input type="email" class="form-control bg-dark text-white border-secondary"
               id="email" name="email" placeholder="zureemail@adibidea.com" autocomplete="email"/>
      </div>

      <div class="mb-4">
        <label for="pasahitza" class="form-label text-secondary text-uppercase small fw-semibold">Pasahitza</label>
        <input type="password" class="form-control bg-dark text-white border-secondary"
               id="pasahitza" name="pasahitza" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <hr class="border-secondary"/>

      <button type="button" class="btn btn-primary w-100 fw-bold mb-2" onclick="handleEnter()">
        Sartu <span id="roleBadge" class="badge bg-primary-subtle text-primary ms-1">Erabiltzailea</span>
      </button>

      <button type="button" class="btn btn-outline-danger w-100" onclick="handleDelete()">
        Datuak ezabatu
      </button>

    </form>
  </div>

  <div class="position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 999">
    <div id="toast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body fw-semibold" id="toastMsg"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function setRole(role) {
      document.getElementById('selectedRoleInput').value = role;
      const badge = document.getElementById('roleBadge');
      if (role === 'admin') {
        badge.textContent = 'Admin';
        badge.className = 'badge bg-danger-subtle text-danger ms-1';
      } else {
        badge.textContent = 'Erabiltzailea';
        badge.className = 'badge bg-primary-subtle text-primary ms-1';
      }
    }

    function handleEnter() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pasahitza').value;
      if (!email || !pass) { showToast('Bete eremu guztiak', 'danger'); return; }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Baliogabeko helbide elektronikoa', 'danger'); return; }
      document.getElementById('loginForm').submit();
    }

    function handleDelete() {
      document.getElementById('email').value = '';
      document.getElementById('pasahitza').value = '';
      showToast('Datuak ezabatu dira', 'danger');
    }

    function showToast(msg, type) {
      const toastEl = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toastEl.className = `toast align-items-center text-bg-${type} border-0`;
      const t = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 2800 });
      t.show();
    }

    window.addEventListener('DOMContentLoaded', () => {
      const errorDiv = document.querySelector('.alert-danger');
      if (errorDiv) {
        showToast(errorDiv.textContent.trim(), 'danger');
      }
    });
  </script>
</body>
</html>
