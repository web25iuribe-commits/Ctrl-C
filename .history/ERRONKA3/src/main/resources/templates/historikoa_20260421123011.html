<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historikoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Miguel Altuna Inbentarioa - Historikoa</a>
        <div class="d-flex align-items-center">
            <span class="text-white me-3" th:text="${currentUser.izena} + ' (' + role + ')'">Erabiltzailea</span>
            <a class="btn btn-outline-light btn-sm me-2" th:href="@{/admin}">Admin</a>
            <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">Irten</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="p-4 mb-4 bg-white rounded shadow-sm">
        <h1 class="h3 mb-2">Historikoa</h1>
        <p class="text-muted mb-0">Sistemako ekintza guztien erregistroa.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive" th:if="${historikoak != null and !#lists.isEmpty(historikoak)}">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Taula</th>
                        <th>Ekintza</th>
                        <th>Data</th>
                        <th>Oharra</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="h : ${historikoak}">
                        <td th:text="${h.id_hist}">1</td>
                        <td th:text="${h.taula != null and !#strings.isEmpty(h.taula) ? h.taula : '(taula hutsik)'}">eraikina</td>
                        <td th:text="${h.ekintza != null and !#strings.isEmpty(h.ekintza) ? h.ekintza : '(ekintza hutsik)'}">INSERT</td>
                        <td th:text="${h.data_aldaketa != null ? #dates.format(h.data_aldaketa, 'yyyy-MM-dd HH:mm:ss') : '(datarik ez)'}">2026-04-20 09:10:00</td>
                        <td th:text="${h.oharra != null and !#strings.isEmpty(h.oharra) ? h.oharra : 'UPDATE erregistratua, baina trigger-eko oharra hutsik dago'}">Ekintza</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="alert alert-info mb-0" th:if="${historikoak == null or #lists.isEmpty(historikoak)}">
                Ez dago historiko erregistrorik oraindik.
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
