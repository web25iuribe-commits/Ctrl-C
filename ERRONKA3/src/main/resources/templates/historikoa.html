<!DOCTYPE html>
<html lang="eu">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historikoa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-dark text-white">

  <nav class="navbar bg-dark border-bottom border-secondary px-4 py-2">
    <span class="navbar-brand text-white fw-bold fs-4">Admin Editorea</span>
    <div class="d-flex align-items-center gap-2">
      <span class="text-secondary me-2">admin</span>
      <a href="#" class="btn btn-outline-secondary btn-sm active">Historia</a>
    </div>
  </nav>

  <div class="container-fluid py-4 px-4">
    <div class="card bg-secondary-subtle border border-secondary">
      <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title text-white mb-0">Historikoa</h5>
          <div class="input-group" style="max-width: 320px;">
            <input id="bilatu-input" type="text" class="form-control bg-dark text-white border-secondary" placeholder="Bilatu..."/>
            <button class="btn btn-primary" onclick="bilatuHistoria()">Bilatu</button>
            <button class="btn btn-outline-secondary" onclick="garbituBilaketa()">X</button>
          </div>
        </div>

        <div class="table-responsive">
          <table id="historikoaTabla" class="table table-dark table-bordered table-hover align-middle">
            <thead class="table-secondary text-dark">
              <tr>
                <th>ID</th>
                <th>Taula</th>
                <th>Ekintza</th>
                <th>Data</th>
                <th>Oharra (Zaharra → Berria)</th>
              </tr>
            </thead>
            <tbody id="historikoaBody">
              <!-- Datuak JavaScriptetik kargatzen dira -->
            </tbody>
          </table>
        </div>

        <div class="d-flex justify-content-end mt-2">
          <a href="./admin.html" class="btn btn-secondary">Itxi</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Datu lehenetsiak (admin-etik aldaketarik ez badago)
    const datuLehenetsiak = [
      { id: 1, taula: 'Erabiltzailea', taulaKlase: 'bg-primary', ekintza: 'Aldatu', ekintzaKlase: 'bg-warning text-dark', data: '2026-04-21 08:30', zaharra: 'mikel@gmail.com', berria: 'mikel@berria.com' },
      { id: 2, taula: 'Eraikina',      taulaKlase: 'bg-info text-dark', ekintza: 'Sortu',  ekintzaKlase: 'bg-success',         data: '2026-04-21 09:05', zaharra: '',               berria: 'C Eraikina, Gasteiz' },
      { id: 3, taula: 'Erabiltzailea', taulaKlase: 'bg-primary', ekintza: 'Ezabatu',ekintzaKlase: 'bg-danger',          data: '2026-04-21 10:00', zaharra: 'leire@email.com', berria: '' },
      { id: 4, taula: 'Eraikina',      taulaKlase: 'bg-info text-dark', ekintza: 'Aldatu', ekintzaKlase: 'bg-warning text-dark', data: '2026-04-21 11:20', zaharra: 'Kale Nagusia 1', berria: 'Kale Nagusia 5' },
      { id: 5, taula: 'Erabiltzailea', taulaKlase: 'bg-primary', ekintza: 'Sortu',  ekintzaKlase: 'bg-success',         data: '2026-04-22 08:15', zaharra: '',               berria: 'ane@email.com, Admin' },
    ];

    function oharraCelula(zaharra, berria) {
      if (!zaharra && berria)  return `<span class="text-secondary fst-italic me-1">—</span><span class="text-secondary me-1">→</span><span class="text-success">${berria}</span>`;
      if (zaharra && !berria)  return `<span class="text-danger text-decoration-line-through me-1">${zaharra}</span><span class="text-secondary me-1">→</span><span class="text-secondary fst-italic">—</span>`;
      if (zaharra && berria)   return `<span class="text-danger text-decoration-line-through me-1">${zaharra}</span><span class="text-secondary me-1">→</span><span class="text-success">${berria}</span>`;
      return '<span class="text-secondary fst-italic">—</span>';
    }

    function errendatuHistoria() {
      const gordeta = localStorage.getItem('historikoaErregistroak');
      const erregistroak = gordeta ? JSON.parse(gordeta) : datuLehenetsiak;
      const tbody = document.getElementById('historikoaBody');
      tbody.innerHTML = '';
      erregistroak.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${e.id}</td>
          <td><span class="badge ${e.taulaKlase}">${e.taula}</span></td>
          <td><span class="badge ${e.ekintzaKlase}">${e.ekintza}</span></td>
          <td>${e.data}</td>
          <td>${oharraCelula(e.zaharra, e.berria)}</td>`;
        tbody.appendChild(tr);
      });
    }

    function bilatuHistoria() {
      const bilaketa = document.getElementById('bilatu-input').value.trim().toLowerCase();
      document.querySelectorAll('#historikoaTabla tbody tr').forEach(tr => {
        tr.style.display = tr.textContent.toLowerCase().includes(bilaketa) ? '' : 'none';
      });
    }

    function garbituBilaketa() {
      document.getElementById('bilatu-input').value = '';
      document.querySelectorAll('#historikoaTabla tbody tr').forEach(tr => tr.style.display = '');
    }

    // Kargatu historia orria irekitzean
    errendatuHistoria();
  </script>
</body>
</html>
